services:
  - type: web
    name: scoutflow-ai
    env: python
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"

  - type: web
    name: scoutflow-backend
    env: node
    region: ohio
    buildCommand: "npm install && npx prisma generate"
    startCommand: "npx prisma migrate deploy && npm start"
    envVars:
      - key: NODE_VERSION
        value: 22.2.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: scoutflow-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: DEMO_MODE
        value: "false"
      - key: WORKER_MODE
        value: "in-process"
