services:
  - type: web
    name: scoutflow-ai
    env: python
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "openai/gpt-oss-120b"
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      # FAST prototype profile for the Groq free tier (~2k tokens/req).
      # Raise for deeper production runs (deeper LLM passes).
      - key: LLM_EXTRACT_WINDOW
        value: "6000"
      - key: LLM_MAX_TOKENS
        value: "1500"
      - key: LLM_MAX_ATTEMPTS
        value: "2"
      - key: LLM_MAX_RETRY_WAIT
        value: "12"

  - type: web
    name: scoutflow-backend
    env: node
    region: ohio
    buildCommand: "npm install && npx prisma generate"
    startCommand: "npx prisma migrate deploy && npm start"
    envVars:
      - key: NODE_VERSION
        value: 22.2.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: scoutflow-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: DEMO_MODE
        value: "false"
      # Never substitute demo data for a failed real collection in production.
      - key: ALLOW_DEMO_FALLBACK
        value: "false"
      # Required for live web discovery - without it the search collector
      # cannot run and the task will fail (instead of faking results).
      - key: SERPER_API_KEY
        sync: false
      - key: WORKER_MODE
        value: "in-process"
      # FAST prototype profile for the Groq free tier (~3-6 min runs).
      # Raise for deeper production runs (more sources, deeper LLM passes).
      - key: SEARCH_MAX_QUERIES
        value: "2"
      - key: SEARCH_PAGES_PER_QUERY
        value: "1"
      - key: MAX_SOURCES
        value: "12"
      - key: EXTRACTION_EARLY_STOP
        value: "60"
      - key: FETCH_CONCURRENCY
        value: "4"
      - key: EXTRACTION_CONCURRENCY
        value: "2"
